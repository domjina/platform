apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-ingress
  namespace: default
spec:
  gatewayClassName: istio

  listeners:
  - name: airflow
    hostname: airflow.localhost
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All

  - name: grafana
    hostname: grafana.localhost
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All

  - name: prometheus
    hostname: prometheus.localhost
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All

  - name: garage-s3
    hostname: s3.garage.localhost
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All

  - name: garage
    hostname: garage.localhost
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: airflow
  namespace: airflow
spec:
  parentRefs:
  - name: istio-ingress
    namespace: default
  hostnames:
    - airflow.localhost
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - name: airflow-api-server
          port: 8080

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
  - name: istio-ingress
    namespace: default
  hostnames:
    - grafana.localhost
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - name: my-grafana
          port: 80

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: prometheus
spec:
  parentRefs: 
  - name: istio-ingress
    namespace: default
  hostnames:
    - prometheus.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-server
          port: 80

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-s3
  namespace: garage
spec:
  parentRefs: 
    - name: istio-ingress
      namespace: default
  hostnames:
    - s3.garage.localhost
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - name: garage-headless
          port: 3900

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage
  namespace: garage
spec:
  parentRefs:
    - name: istio-ingress
      namespace: default
  hostnames:
    - garage.localhost
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - name: garage
          port: 3902