data:
  metadataSecretName: airflow.details

apiServer:
  args: ["bash", "-c", "exec airflow api-server --proxy-headers"]
  env:
    - name: FORWARDED_ALLOW_IPS
      value: "*"

config:
  api:
    base_url: http://airflow.localhost

migrateDatabaseJob:
  enabled: true
  useHelmHooks: false

postgresql:
  enabled: false

dagProcessor:
  dagBundleConfigList:
    - name: airflow_dags
      classpath: "airflow.providers.git.bundles.git.GitDagBundle"
      "kwargs": {
        "tracking_ref": "main",
        "refresh_interval": 300,
        "git_conn_id": "DAGs"
      }